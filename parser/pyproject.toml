[project]
name = "claude-tinderbox"
version = "0.1.0"
description = "Personal claude.ai conversation archive — ingest, embed, search, and MCP server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Lucky", email = "luckyrmp@gmail.com" }]
keywords = ["claude", "ai", "archive", "search", "mcp", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "httpx>=0.24.0",
    "anthropic>=0.40.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/luckyrmp/tinderbox-archive"
Repository = "https://github.com/luckyrmp/tinderbox-archive"
Issues = "https://github.com/luckyrmp/tinderbox-archive/issues"

[project.scripts]
tinderbox = "tinderbox.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinderbox*"]
